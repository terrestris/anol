<div class="time-series">
    <button title="{{ 'anol.timeseries.SET_TIME' | translate }}"
            ng-click="openDialog()"
            class="toggle-layer-conf glyphicon glyphicon-time pointer"
            ng-style="{'color': (timeIsDefault() ? 'inherit' : '#337ab7')}">
    </button>
    <span class="time-series-label pointer" ng-click="openDialog()">
        {{ timeLabel() }}
    </span>
</div>
